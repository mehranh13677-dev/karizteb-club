<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل مدیریت کاریز طب | سامانه جامع باشگاه مشتریان</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --primary: #00875a;
      --primary-hover: #006644;
      --accent: #f5a623;
      --accent-hover: #e09216;
      --bg: #f4f6f8;
      --card-bg: #ffffff;
      --text-main: #333333;
      --text-muted: #666666;
      --danger: #de350b;
      --danger-hover: #bd2700;
      --border-color: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      font-family: Tahoma, 'Segoe UI', Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 15px;
      direction: rtl;
      line-height: 1.6;
    }

    .container {
      max-width: 650px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(0, 0, 0, 0.03);
    }

    .header-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn {
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-accent {
      background: var(--accent);
      color: #ffffff;
    }

    .btn-accent:hover {
      background: var(--accent-hover);
    }

    .btn-danger {
      background: var(--danger);
      color: #ffffff;
    }

    .btn-danger:hover {
      background: var(--danger-hover);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--primary);
      color: var(--primary);
    }

    .form-group {
      margin-bottom: 12px;
      text-align: right;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 5px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .form-control {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--primary);
    }

    .user-card-item {
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      background: #fafafa;
    }

    .user-card-header {
      font-weight: bold;
      color: var(--primary);
      font-size: 0.95rem;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .user-details {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      line-height: 1.8;
    }

    .flex-gap {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.85rem;
    }

    th, td {
      border: 1px solid var(--border-color);
      padding: 9px;
      text-align: center;
    }

    th {
      background-color: #f0f0f0;
      color: var(--text-main);
    }

    .msg-card-item {
      background: #e6f7ff;
      border: 1px solid #91d5ff;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- ==================== هدر مدیریت ==================== -->
  <div class="card header-card">
    <div>
      <h3 style="color: var(--primary); font-size: 1.2rem;">پنل مدیریت کاریز طب</h3>
      <p style="font-size: 0.8rem; color: var(--text-muted);">مدیریت اعضا، پیام‌ها و گزارشات</p>
    </div>
    <button class="btn btn-danger" onclick="location.reload()">🔄 بروزرسانی لیست</button>
  </div>

  <!-- ==================== بخش انتشار بنر و پیام عمومی ==================== -->
  <div class="card">
    <h4 style="color: var(--primary); margin-bottom: 10px;">📢 مدیریت بنر و پیام عمومی مشتریان</h4>
    
    <div class="form-group">
      <label for="admin-ann-title">عنوان اطلاعیه</label>
      <input type="text" id="admin-ann-title" class="form-control" placeholder="عنوان پیام عمومی">
    </div>

    <div class="form-group">
      <label for="admin-ann-text">متن اطلاعیه</label>
      <textarea id="admin-ann-text" class="form-control" rows="3" placeholder="متن پیام تبلیغاتی یا عمومی..."></textarea>
    </div>

    <div class="form-group">
      <label for="admin-ann-img">تصویر بنر تبلیغاتی (اختیاری)</label>
      <input type="file" id="admin-ann-img" accept="image/*" class="form-control">
    </div>

    <button class="btn btn-primary" style="width: 100%;" onclick="savePublicAnnouncement()">انتشار پیام برای تمامی کاربران</button>
  </div>

  <!-- ==================== لیست پیام‌های دریافتی از مشتریان ==================== -->
  <div class="card">
    <h4 style="color: var(--primary); margin-bottom: 10px;">📩 پیام‌ها و اعلام نیازهای دریافتی مشتریان</h4>
    <div id="customer-messages-container"></div>
  </div>

  <!-- ==================== لیست کامل و جامع تمامی اعضا ==================== -->
  <div class="card">
    <h4 style="color: var(--primary); margin-bottom: 10px;">👥 لیست تمامی اعضای ثبت‌نام شده</h4>
    <div id="users-list-container"></div>
  </div>

  <!-- ==================== آمار تفکیک استانی و خروجی ==================== -->
  <div class="card">
    <h4 style="color: var(--primary); margin-bottom: 8px;">📊 گزارش تفکیک شهری / استانی اعضا</h4>
    
    <div class="flex-gap" style="margin-bottom: 12px;">
      <button class="btn btn-accent" style="flex: 1;" onclick="exportToExcel()">📥 دانلود فایل اکسل (CSV)</button>
      <button class="btn btn-accent" style="flex: 1;" onclick="exportToPDF()">📄 دانلود فایل PDF</button>
    </div>

    <div id="province-report-table"></div>
  </div>

  <!-- ==================== پشتیبان‌گیری دیتابیس جهت آپدیت‌ها ==================== -->
  <div class="card">
    <h4 style="color: var(--primary); margin-bottom: 6px;">💾 پشتیبان‌گیری دائم از اطلاعات اعضا</h4>
    <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 10px;">جهت جلوگیری از پاک شدن اعضا در آپدیت‌های بعدی کدهای سیستم:</p>
    
    <div class="flex-gap">
      <button class="btn btn-primary" style="flex: 1;" onclick="exportDatabase()">⬇️ دانلود بک‌آپ اطلاعات</button>
      <input type="file" id="import-db-file" style="display: none;" onchange="importDatabase(event)">
      <button class="btn btn-outline" style="flex: 1;" onclick="document.getElementById('import-db-file').click()">⬆️ بازیابی فایل بک‌آپ</button>
    </div>
  </div>

</div>

<!-- ==================== اسکریپت‌های مدیریت ==================== -->
<script>
  // بارگذاری دیتابیس مشترک با مشتریان
  let db = JSON.parse(localStorage.getItem('karizteb_db')) || {
    users: [],
    publicAnnouncement: { title: 'خوش آمدید', text: 'به باشگاه مشتریان کاریز طب خوش آمدید.', img: '' },
    messages: []
  };

  function saveDB() {
    localStorage.setItem('karizteb_db', JSON.stringify(db));
  }

  // رندر اولیه تمام بخش‌های مدیریت
  function initAdmin() {
    renderUsersList();
    renderCustomerMessages();
    renderProvinceReport();

    // پر کردن کادرهای پیام عمومی
    const ann = db.publicAnnouncement || {};
    document.getElementById('admin-ann-title').value = ann.title || '';
    document.getElementById('admin-ann-text').value = ann.text || '';
  }

  // ۱. رندر تمام اعضای ثبت‌نام شده
  function renderUsersList() {
    const container = document.getElementById('users-list-container');
    container.innerHTML = '';

    if (!db.users || db.users.length === 0) {
      container.innerHTML = '<p style="font-size: 0.85rem; color: #888; text-align: center; padding: 15px;">هیچ کاربری هنوز ثبت‌نام نکرده است.</p>';
      return;
    }

    db.users.forEach(function(user) {
      const card = document.createElement('div');
      card.className = 'user-card-item';

      card.innerHTML = `
        <div class="user-card-header">
          <span>${user.fullname}</span>
          <small style="color: var(--accent); font-weight: bold;">کد: KT-${user.id.toString().slice(-4)}</small>
        </div>
        <div class="user-details">
          📍 <strong>مرکز/شهر:</strong> ${user.center} (${user.city})<br>
          📱 <strong>شماره همراه:</strong> ${user.phone}<br>
          👤 <strong>نام کاربری:</strong> <span style="color:#00875a; font-weight:bold;">${user.username}</span> | 🔑 <strong>رمز عبور:</strong> ${user.password}
        </div>
        
        <div class="form-group" style="margin-top: 8px;">
          <input type="text" id="priv-msg-${user.id}" value="${user.privateMsg || ''}" class="form-control" style="font-size: 0.82rem;" placeholder="پیام اختصاصی که فقط این مشتری ببیند...">
        </div>

        <div class="flex-gap">
          <button class="btn btn-primary" style="font-size: 0.78rem; padding: 6px 12px;" onclick="savePrivateMsg(${user.id})">ثبت پیام اختصاصی</button>
          <button class="btn btn-outline" style="font-size: 0.78rem; padding: 6px 12px;" onclick="copySmsText('${user.fullname}', '${user.username}', '${user.password}')">📋 کپی پیامک اکانت</button>
          <button class="btn btn-danger" style="font-size: 0.78rem; padding: 6px 12px;" onclick="deleteUser(${user.id})">حذف کاربر</button>
        </div>
      `;

      container.appendChild(card);
    });
  }

  // ذخیره پیام اختصاصی مدیر به یک کاربر مشخص
  function savePrivateMsg(userId) {
    const inputField = document.getElementById('priv-msg-' + userId);
    const user = db.users.find(u => u.id === userId);

    if (user && inputField) {
      user.privateMsg = inputField.value.trim();
      saveDB();
      alert('پیام اختصاصی با موفقیت برای ' + user.fullname + ' ثبت شد.');
    }
  }

  // کپی سریع پیامک اطلاعات کاربری برای مشتری
  function copySmsText(fullname, username, password) {
    const sms = 'مشتری گرامی ' + fullname + '\nاطلاعات ورود شما به باشگاه کاریز طب:\nنام کاربری: ' + username + '\nرمز عبور: ' + password + '\nلینک ورود: karizteb.ir';
    navigator.clipboard.writeText(sms);
    alert('متن پیامک حساب کاربری کپی شد:\n\n' + sms);
  }

  // حذف کاربر
  function deleteUser(userId) {
    if (confirm('آیا از حذف این کاربر اطمینان دارید؟')) {
      db.users = db.users.filter(u => u.id !== userId);
      saveDB();
      renderUsersList();
      renderProvinceReport();
    }
  }

  // ۲. نمایش پیام‌های دریافتی از مشتریان
  function renderCustomerMessages() {
    const container = document.getElementById('customer-messages-container');
    container.innerHTML = '';

    if (!db.messages || db.messages.length === 0) {
      container.innerHTML = '<p style="font-size: 0.85rem; color: #888; text-align: center;">پیام جدیدی دریافت نشده است.</p>';
      return;
    }

    db.messages.forEach(function(msg) {
      const item = document.createElement('div');
      item.className = 'msg-card-item';

      let imgHtml = '';
      if (msg.img) {
        imgHtml = '<br><img src="' + msg.img + '" style="max-width: 100%; border-radius: 8px; margin-top: 8px;">';
      }

      item.innerHTML = `
        <strong>فرستنده: ${msg.userName} (${msg.userCenter || 'مشتری'})</strong> - <small style="color:#666;">تاریخ: ${msg.date}</small>
        <p style="margin-top: 5px; color:#333;">${msg.text}</p>
        ${imgHtml}
      `;

      container.appendChild(item);
    });
  }

  // ۳. ذخیره و انتشار بنر اطلاع‌رسانی عمومی
  function savePublicAnnouncement() {
    const title = document.getElementById('admin-ann-title').value.trim();
    const text = document.getElementById('admin-ann-text').value.trim();
    const fileInput = document.getElementById('admin-ann-img');

    if (fileInput.files && fileInput.files[0]) {
      const reader = new FileReader();
      reader.onload = function(e) {
        db.publicAnnouncement = {
          title: title,
          text: text,
          img: e.target.result
        };
        saveDB();
        alert('اطلاعیه عمومی با تصویر جدید منتشر شد.');
      };
      reader.readAsDataURL(fileInput.files[0]);
    } else {
      db.publicAnnouncement = {
        title: title,
        text: text,
        img: (db.publicAnnouncement ? db.publicAnnouncement.img : '')
      };
      saveDB();
      alert('اطلاعیه متنی با موفقیت منتشر شد.');
    }
  }

  // ۴. جدول گزارش‌گیری تفکیک استانی/شهری
  function renderProvinceReport() {
    const report = {};

    if (db.users) {
      db.users.forEach(function(u) {
        const cityKey = u.city || 'نامشخص';
        report[cityKey] = (report[cityKey] || 0) + 1;
      });
    }

    let html = '<table><thead><tr><th>شهر / استان</th><th>تعداد اعضای ثبت‌نامی</th></tr></thead><tbody>';
    for (let city in report) {
      html += '<tr><td>' + city + '</td><td>' + report[city] + ' نفر</td></tr>';
    }
    html += '</tbody></table>';

    document.getElementById('province-report-table').innerHTML = html;
  }

  // خروجی Excel (CSV)
  function exportToExcel() {
    let csv = '\uFEFFشهر/استان,تعداد اعضا\n';
    const report = {};

    db.users.forEach(function(u) {
      const cityKey = u.city || 'نامشخص';
      report[cityKey] = (report[cityKey] || 0) + 1;
    });

    for (let city in report) {
      csv += city + ',' + report[city] + '\n';
    }

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'گزارش_استانی_کاریزطب.csv';
    link.click();
  }

  // خروجی PDF
  function exportToPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.text('Kariz Teb Users Report', 10, 10);

    let y = 20;
    db.users.forEach(function(u, i) {
      doc.text((i + 1) + '. ' + u.fullname + ' - ' + u.center + ' (' + u.city + ') - Tel: ' + u.phone, 10, y);
      y += 10;
    });

    doc.save('گزارش_کاریزطب.pdf');
  }

  // ۵. خروجی و بازیابی فایل دیتابیس جهت پشتیبان‌گیری
  function exportDatabase() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db));
    const dlAnchor = document.createElement('a');
    dlAnchor.setAttribute("href", dataStr);
    dlAnchor.setAttribute("download", "karizteb_backup.json");
    dlAnchor.click();
  }

  function importDatabase(event) {
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        db = JSON.parse(e.target.result);
        saveDB();
        alert('اطلاعات با موفقیت بازیابی شدند.');
        initAdmin();
      } catch (err) {
        alert('فایل وارد شده نامعتبر است.');
      }
    };
    reader.readAsText(event.target.files[0]);
  }

  // اجرای اولویت‌دار پنل
  initAdmin();
</script>

</body>
</html>
