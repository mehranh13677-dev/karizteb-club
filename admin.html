
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت کاریز طب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <style>body { font-family: 'Vazirmatn', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4">

    <!-- قفل امنیتی ورود -->
    <div id="adminLoginBox" class="max-w-md mx-auto my-16 bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-4">
        <h2 class="text-base font-bold text-amber-400 text-center">🔒 ورود به پنل مدیریت کاریز طب</h2>
        <input id="admUser" type="text" placeholder="نام کاربری (admin)" class="w-full bg-slate-950 border border-slate-700 p-2.5 rounded-xl text-xs">
        <input id="admPass" type="password" placeholder="رمز عبور (kariz123)" class="w-full bg-slate-950 border border-slate-700 p-2.5 rounded-xl text-xs">
        <button onclick="checkAdminLogin()" class="w-full bg-amber-500 text-slate-950 font-bold py-2 rounded-xl text-xs">ورود به مدیریت</button>
    </div>

    <!-- محتوای کامل مدیریت پس از ورود -->
    <div id="adminMainContent" class="hidden max-w-4xl mx-auto space-y-6">

        <header class="flex justify-between items-center border-b border-slate-800 pb-4">
            <h1 class="font-bold text-amber-400 text-lg">⚙️ پنل مدیریت هوشمند کاریز طب</h1>
            <span class="text-xs bg-emerald-500/10 text-emerald-400 px-3 py-1 rounded-full border border-emerald-500/20">مدیر آنلاین</span>
        </header>

        <!-- ابزارهای قبلی: آپلود اکسل هلو و سیستم فاکتور -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3">
            <h2 class="font-bold text-sm text-amber-300">📁 همگام‌سازی با هلو و دیتابیس</h2>
            <div class="flex gap-2">
                <input type="file" id="excelUpload" class="text-xs text-slate-400">
                <button onclick="alert('فایل اکسل هلو پردازش شد!')" class="bg-emerald-600 text-white font-bold px-4 py-1.5 rounded-xl text-xs">آپلود اکسل</button>
            </div>
        </section>

        <!-- مدیریت کاتالوگ همراه با امکان آپلود تصویر اختصاصی -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
            <h2 class="font-bold text-sm text-amber-300">📸 افزودن کالا همراه با تصویر اختصاصی</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-2 text-xs">
                <input id="pName" placeholder="نام محصول" class="bg-slate-950 border border-slate-700 rounded-xl p-2">
                <input id="pUnit" placeholder="واحد (مثلاً کارتنی)" class="bg-slate-950 border border-slate-700 rounded-xl p-2">
                <input id="pPrice" type="number" placeholder="قیمت (ریال)" class="bg-slate-950 border border-slate-700 rounded-xl p-2">
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-2 text-xs">
                <input id="pDesc" placeholder="توضیحات محصول" class="bg-slate-950 border border-slate-700 rounded-xl p-2 col-span-2">
                <div class="flex items-center gap-1">
                    <span class="text-[10px] text-slate-400">عکس:</span>
                    <input type="file" id="pImgFile" accept="image/*" class="text-[10px] text-slate-400">
                </div>
            </div>
            <button onclick="addProduct()" class="w-full bg-amber-500 text-slate-950 font-bold rounded-xl py-2 text-xs">+ ثبت کالا در کاتالوگ</button>

            <!-- لیست کالاهای ثبت شده -->
            <div id="adminProductList" class="space-y-2 text-xs pt-3"></div>
        </section>

        <!-- بررسی و مدیریت سفارشات آنلاین B2B -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
            <h2 class="font-bold text-sm text-blue-400">📋 سفارشات دریافتی آنلاین</h2>
            <div id="adminOrdersList" class="space-y-3 text-xs"></div>
        </section>

    </div>

    <script>
        function checkAdminLogin() {
            const u = document.getElementById('admUser').value;
            const p = document.getElementById('admPass').value;
            if(u === 'admin' && p === 'kariz123') {
                document.getElementById('adminLoginBox').classList.add('hidden');
                document.getElementById('adminMainContent').classList.remove('hidden');
                renderAdminProducts();
                renderAdminOrders();
            } else {
                alert('نام کاربری یا رمز عبور نادرست است.');
            }
        }

        function renderAdminProducts() {
            let products = JSON.parse(localStorage.getItem('kt_products')) || [];
            const container = document.getElementById('adminProductList');
            container.innerHTML = '';
            products.forEach((p, i) => {
                const imgTag = p.img ? `<img src="${p.img}" class="w-8 h-8 object-cover rounded">` : `<span class="text-[10px] text-slate-500">بدون عکس</span>`;
                container.innerHTML += `
                    <div class="flex justify-between items-center bg-slate-950 p-2.5 rounded-xl border border-slate-800">
                        <div class="flex items-center gap-2">
                            ${imgTag}
                            <div>
                                <b class="text-slate-200">${p.name}</b> (${p.unit}) - <span class="text-emerald-400">${p.price.toLocaleString()} ریال</span>
                                <p class="text-[10px] text-slate-400">${p.desc||''}</p>
                            </div>
                        </div>
                        <button onclick="deleteProduct(${i})" class="text-rose-400 text-xs">حذف 🗑️</button>
                    </div>
                `;
            });
        }

        function addProduct() {
            const name = document.getElementById('pName').value.trim();
            const unit = document.getElementById('pUnit').value.trim();
            const price = parseInt(document.getElementById('pPrice').value);
            const desc = document.getElementById('pDesc').value.trim();
            const imgInput = document.getElementById('pImgFile');

            if(!name || !unit || !price) return alert('اطلاعات کالا را کامل وارد کنید.');

            let base64Image = '';
            if(imgInput.files && imgInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    base64Image = e.target.result;
                    saveProductData(name, unit, price, desc, base64Image);
                };
                reader.readAsDataURL(imgInput.files[0]);
            } else {
                saveProductData(name, unit, price, desc, '');
            }
        }

        function saveProductData(name, unit, price, desc, img) {
            let products = JSON.parse(localStorage.getItem('kt_products')) || [];
            products.push({ id: Date.now(), name, unit, price, desc, img });
            localStorage.setItem('kt_products', JSON.stringify(products));
            
            document.getElementById('pName').value = '';
            document.getElementById('pUnit').value = '';
            document.getElementById('pPrice').value = '';
            document.getElementById('pDesc').value = '';
            document.getElementById('pImgFile').value = '';

            renderAdminProducts();
            alert('کالا با موفقیت ذخیره شد!');
        }

        function deleteProduct(index) {
            let products = JSON.parse(localStorage.getItem('kt_products')) || [];
            products.splice(index, 1);
            localStorage.setItem('kt_products', JSON.stringify(products));
            renderAdminProducts();
        }

        function renderAdminOrders() {
            let orders = JSON.parse(localStorage.getItem('kt_orders')) || [];
            const container = document.getElementById('adminOrdersList');
            if(orders.length === 0) {
                container.innerHTML = '<p class="text-slate-500 text-center py-2">هیچ سفارشی ثبت نشده است.</p>';
                return;
            }

            container.innerHTML = '';
            orders.reverse().forEach((o, index) => {
                const realIndex = orders.length - 1 - index;
                container.innerHTML += `
                    <div class="bg-slate-950 p-3.5 rounded-xl border border-slate-800 space-y-2">
                        <div class="flex justify-between font-bold text-amber-400">
                            <span>مشتری: ${o.userName} (${o.userPhone})</span>
                            <span>کد: ${o.userCode}</span>
                        </div>
                        <div class="text-slate-300 text-[11px]">${o.items.join(' | ')}</div>
                        <div class="text-emerald-400 font-bold">مبلغ فاکتور: ${o.total.toLocaleString()} ریال</div>
                        
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-2 pt-1">
                            <select id="status_${realIndex}" class="bg-slate-900 border border-slate-700 rounded p-1 text-[11px]">
                                <option ${o.status === 'در حال بررسی ⏳' ? 'selected' : ''}>در حال بررسی ⏳</option>
                                <option ${o.status === 'تایید شده ✅' ? 'selected' : ''}>تایید شده ✅</option>
                                <option ${o.status === 'رد شده ❌' ? 'selected' : ''}>رد شده ❌</option>
                            </select>
                            <select id="ship_${realIndex}" class="bg-slate-900 border border-slate-700 rounded p-1 text-[11px]">
                                <option ${o.shipping === 'در حال آماده‌سازی انبار 📦' ? 'selected' : ''}>در حال آماده‌سازی انبار 📦</option>
                                <option ${o.shipping === 'ارسال با اسنپ/تپسی 🛵' ? 'selected' : ''}>ارسال با اسنپ/تپسی 🛵</option>
                                <option ${o.shipping === 'ارسال با تیپاکس/پست ✈️' ? 'selected' : ''}>ارسال با تیپاکس/پست ✈️</option>
                            </select>
                            <button onclick="updateOrder(${realIndex})" class="bg-blue-600 text-white font-bold rounded p-1 text-[11px]">ذخیره بروزرسانی</button>
                        </div>
                        <input id="note_${realIndex}" value="${o.note || ''}" placeholder="پیام یا اخطار اصلاحی برای مشتری..." class="w-full bg-slate-900 border border-slate-800 rounded p-1 text-[10px] text-rose-300">
                    </div>
                `;
            });
        }

        function updateOrder(index) {
            let orders = JSON.parse(localStorage.getItem('kt_orders')) || [];
            orders[index].status = document.getElementById(`status_${index}`).value;
            orders[index].shipping = document.getElementById(`ship_${index}`).value;
            orders[index].note = document.getElementById(`note_${index}`).value;
            localStorage.setItem('kt_orders', JSON.stringify(orders));
            alert('تغییرات سفارش ذخیره شد!');
            renderAdminOrders();
        }
    </script>
</body>
</html>
