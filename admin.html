
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت کاریز طب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <style>body { font-family: 'Vazirmatn', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4">

    <div class="max-w-4xl mx-auto space-y-6">

        <!-- هدر پنل مدیر -->
        <header class="flex justify-between items-center border-b border-slate-800 pb-4">
            <h1 class="font-bold text-amber-400 text-lg">⚙️ پنل مدیریت هوشمند کاریز طب</h1>
            <span class="text-xs bg-emerald-500/10 text-emerald-400 px-3 py-1 rounded-full border border-emerald-500/20">مدیر فعال</span>
        </header>

        <!-- بخش ۱: مدیریت محصولات و قیمت‌ها -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
            <h2 class="font-bold text-sm text-amber-300 flex items-center gap-2">🛒 افزودن / ویرایش لیست کالاها</h2>
            <div class="grid grid-cols-1 md:grid-cols-5 gap-2 text-xs">
                <input id="pName" placeholder="نام محصول" class="bg-slate-950 border border-slate-700 rounded-xl p-2">
                <input id="pUnit" placeholder="واحد (مثلاً کارتنی)" class="bg-slate-950 border border-slate-700 rounded-xl p-2">
                <input id="pPrice" type="number" placeholder="قیمت (ریال)" class="bg-slate-950 border border-slate-700 rounded-xl p-2">
                <input id="pDesc" placeholder="توضیحات (اختیاری)" class="bg-slate-950 border border-slate-700 rounded-xl p-2">
                <button onclick="addProduct()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl py-2">+ افزودن کالا</button>
            </div>

            <!-- جدول لیست کالاها -->
            <div id="adminProductList" class="space-y-2 text-xs">
                <!-- به صورت پویا پر می‌شود -->
            </div>
        </section>

        <!-- بخش ۲: بررسی و مدیریت سفارشات مشتریان -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
            <h2 class="font-bold text-sm text-blue-400">📋 سفارشات دریافتی مشتریان</h2>
            <div id="adminOrdersList" class="space-y-3 text-xs">
                <!-- به صورت پویا پر می‌شود -->
            </div>
        </section>

    </div>

    <script>
        // بارگذاری و ذخیره‌سازی کاتالوگ
        function renderAdminProducts() {
            let products = JSON.parse(localStorage.getItem('kt_products')) || [];
            const container = document.getElementById('adminProductList');
            container.innerHTML = '';
            products.forEach((p, i) => {
                container.innerHTML += `
                    <div class="flex justify-between items-center bg-slate-950 p-3 rounded-xl border border-slate-800">
                        <div>
                            <b class="text-slate-200">${p.name}</b> (${p.unit}) - <span class="text-emerald-400">${p.price.toLocaleString()} ریال</span>
                            <p class="text-[10px] text-slate-400">${p.desc || ''}</p>
                        </div>
                        <button onclick="deleteProduct(${i})" class="text-rose-400 hover:text-rose-300">حذف 🗑️</button>
                    </div>
                `;
            });
        }

        function addProduct() {
            const name = document.getElementById('pName').value.trim();
            const unit = document.getElementById('pUnit').value.trim();
            const price = parseInt(document.getElementById('pPrice').value);
            const desc = document.getElementById('pDesc').value.trim();

            if(!name || !unit || !price) return alert('اطلاعات کالا را کامل وارد کنید.');

            let products = JSON.parse(localStorage.getItem('kt_products')) || [];
            products.push({ id: Date.now(), name, unit, price, desc });
            localStorage.setItem('kt_products', JSON.stringify(products));
            
            document.getElementById('pName').value = '';
            document.getElementById('pUnit').value = '';
            document.getElementById('pPrice').value = '';
            document.getElementById('pDesc').value = '';
            renderAdminProducts();
        }

        function deleteProduct(index) {
            let products = JSON.parse(localStorage.getItem('kt_products')) || [];
            products.splice(index, 1);
            localStorage.setItem('kt_products', JSON.stringify(products));
            renderAdminProducts();
        }

        // بارگذاری و بروزرسانی سفارشات
        function renderAdminOrders() {
            let orders = JSON.parse(localStorage.getItem('kt_orders')) || [];
            const container = document.getElementById('adminOrdersList');
            if(orders.length === 0) {
                container.innerHTML = '<p class="text-slate-500 text-center py-2">هیچ سفارشی ثبت نشده است.</p>';
                return;
            }

            container.innerHTML = '';
            orders.reverse().forEach((o, index) => {
                const realIndex = orders.length - 1 - index;
                container.innerHTML += `
                    <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-3">
                        <div class="flex justify-between font-bold text-amber-400 border-b border-slate-800 pb-2">
                            <span>مشتری: ${o.userName} (${o.userPhone})</span>
                            <span>کد: ${o.userCode}</span>
                        </div>
                        <div class="text-slate-300 font-medium">${o.items.join(' | ')}</div>
                        <div class="text-emerald-400 font-bold">مبلغ فاکتور: ${o.total.toLocaleString()} ریال</div>
                        
                        <!-- فرم بروزرسانی مدیر -->
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-2 pt-2 border-t border-slate-900">
                            <select id="status_${realIndex}" class="bg-slate-900 border border-slate-700 rounded p-1 text-[11px]">
                                <option ${o.status === 'در حال بررسی ⏳' ? 'selected' : ''}>در حال بررسی ⏳</option>
                                <option ${o.status === 'تایید شده ✅' ? 'selected' : ''}>تایید شده ✅</option>
                                <option ${o.status === 'رد شده ❌' ? 'selected' : ''}>رد شده ❌</option>
                                <option ${o.status === 'نیازمند اصلاح ⚠️' ? 'selected' : ''}>نیازمند اصلاح ⚠️</option>
                            </select>

                            <select id="ship_${realIndex}" class="bg-slate-900 border border-slate-700 rounded p-1 text-[11px]">
                                <option ${o.shipping === 'در حال آماده‌سازی انبار 📦' ? 'selected' : ''}>در حال آماده‌سازی انبار 📦</option>
                                <option ${o.shipping === 'ارسال با اسنپ/تپسی 🛵' ? 'selected' : ''}>ارسال با اسنپ/تپسی 🛵</option>
                                <option ${o.shipping === 'ارسال با تیپاکس/پست ✈️' ? 'selected' : ''}>ارسال با تیپاکس/پست ✈️</option>
                                <option ${o.shipping === 'ارسال با باربری 🚚' ? 'selected' : ''}>ارسال با باربری 🚚</option>
                            </select>

                            <button onclick="updateOrder(${realIndex})" class="bg-blue-600 hover:bg-blue-500 text-white font-bold rounded p-1">ذخیره بروزرسانی</button>
                        </div>
                        <input id="note_${realIndex}" value="${o.note || ''}" placeholder="پیام یا اخطار اصلاحی (مثلاً: ثبت فقط به صورت کارتنی)" class="w-full bg-slate-900 border border-slate-800 rounded p-1.5 text-[10px] text-rose-300">
                    </div>
                `;
            });
        }

        function updateOrder(index) {
            let orders = JSON.parse(localStorage.getItem('kt_orders')) || [];
            orders[index].status = document.getElementById(`status_${index}`).value;
            orders[index].shipping = document.getElementById(`ship_${index}`).value;
            orders[index].note = document.getElementById(`note_${index}`).value;
            localStorage.setItem('kt_orders', JSON.stringify(orders));
            alert('تغییرات سفارش با موفقیت ذخیره شد!');
            renderAdminOrders();
        }

        // اجرای اولیه
        renderAdminProducts();
        renderAdminOrders();
    </script>
</body>
</html>
