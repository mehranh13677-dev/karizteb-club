
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>باشگاه مشتریان کاریز طب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
        .gold-bg { background: linear-gradient(135deg, #BF953F 0%, #FCF6BA 25%, #B38728 50%, #FBF5B7 75%, #AA771C 100%); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 pb-20">

    <header class="max-w-2xl mx-auto flex justify-between items-center border-b border-slate-800 pb-4 mb-6">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 gold-bg rounded-xl flex items-center justify-center font-black text-slate-950">KT</div>
            <div>
                <h1 class="font-bold text-lg text-amber-400">کاریز طب</h1>
                <p class="text-[10px] text-slate-400">سامانه جامع باشگاه مشتریان و ثبت سفارش آنلاین</p>
            </div>
        </div>
        <div id="userInfo" class="hidden text-xs bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-lg text-emerald-400 font-bold"></div>
    </header>

    <main class="max-w-2xl mx-auto space-y-6">

        <!-- ورود/ثبت‌نام -->
        <section id="authBox" class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
            <h2 class="text-sm font-bold text-amber-300">🔑 ورود به حساب کاربری</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <input id="custName" type="text" placeholder="نام و نام خانوادگی / مرکز درمانی" class="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs focus:outline-none">
                <input id="custPhone" type="tel" placeholder="شماره همراه (مثلاً 09123456789)" class="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs focus:outline-none">
            </div>
            <button onclick="loginCustomer()" class="w-full gold-bg text-slate-950 font-bold py-2.5 rounded-xl text-xs">ورود به پنل اختصاصی</button>
        </section>

        <div id="mainPanel" class="hidden space-y-6">

            <!-- خلاصه امتیازات و کارت VIP (قبلی) -->
            <div class="bg-slate-900 border border-amber-500/30 rounded-2xl p-4 grid grid-cols-3 gap-2 text-center text-xs">
                <div class="bg-slate-950 p-2.5 rounded-xl">
                    <span class="block text-slate-400 text-[10px] mb-1">سطح شما</span>
                    <span id="userTier" class="font-bold text-amber-400">عادی ⚪</span>
                </div>
                <div class="bg-slate-950 p-2.5 rounded-xl">
                    <span class="block text-slate-400 text-[10px] mb-1">امتیاز خرید</span>
                    <span id="userPoints" class="font-bold text-emerald-400">۰</span>
                </div>
                <div class="bg-slate-950 p-2.5 rounded-xl">
                    <span class="block text-slate-400 text-[10px] mb-1">کد اختصاصی</span>
                    <span id="userCode" class="font-bold text-blue-400">---</span>
                </div>
            </div>

            <div id="adminNotice" class="hidden bg-amber-500/10 border border-amber-500/30 text-amber-200 p-3 rounded-xl text-xs"></div>

            <!-- جدید: کاتالوگ و ثبت سفارش آنلاین -->
            <section class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
                <h3 class="font-bold text-sm text-emerald-400">🛒 ثبت سفارش آنلاین محصولات</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-right text-xs">
                        <thead class="bg-slate-950 text-slate-400">
                            <tr>
                                <th class="p-2">محصول</th>
                                <th class="p-2">واحد</th>
                                <th class="p-2">قیمت (ریال)</th>
                                <th class="p-2">تعداد</th>
                                <th class="p-2">جمع</th>
                            </tr>
                        </thead>
                        <tbody id="catalogTableBody" class="divide-y divide-slate-800/50"></tbody>
                    </table>
                </div>
                <div class="bg-slate-950 p-4 rounded-xl flex justify-between items-center">
                    <div>
                        <span class="text-xs text-slate-400 block">جمع کل فاکتور:</span>
                        <span id="grandTotal" class="text-base font-black text-amber-400">۰ ریال</span>
                    </div>
                    <button onclick="submitOrder()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2 rounded-xl text-xs">
                        📲 ثبت و ارسال پیامک به 09398490440
                    </button>
                </div>
            </section>

            <!-- جدید: پیگیری زنده سفارشات و ارسال بار -->
            <section class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3">
                <h3 class="font-bold text-sm text-blue-400">📦 پیگیری زنده سفارشات و وضعیت ارسال</h3>
                <div id="ordersList" class="space-y-3 text-xs"></div>
            </section>

            <!-- بخش قبلی: ثبت فاکتور توسط مشتری -->
            <section class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3">
                <h3 class="font-bold text-sm text-amber-300">📄 آپلود فاکتور جهت دریافت امتیاز</h3>
                <input type="file" id="custInvoiceFile" class="text-xs text-slate-400">
                <button onclick="alert('فاکتور با موفقیت ارسال شد و پس از بررسی امتیاز آن اعمال می‌شود.')" class="bg-amber-500 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs w-full">ارسال فاکتور</button>
            </section>

        </div>

    </main>

    <script>
        let currentUser = null;
        let products = JSON.parse(localStorage.getItem('kt_products')) || [];

        function loginCustomer() {
            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            if(!name || !phone) return alert('لطفاً نام و شماره همراه را وارد کنید.');

            currentUser = { name, phone, code: 'KT-' + phone.slice(-4) };
            document.getElementById('authBox').classList.add('hidden');
            document.getElementById('mainPanel').classList.remove('hidden');
            document.getElementById('userInfo').innerText = `${name} (${currentUser.code})`;
            document.getElementById('userInfo').classList.remove('hidden');
            document.getElementById('userCode').innerText = currentUser.code;

            loadCatalog();
            loadUserOrderHistory();
        }

        function loadCatalog() {
            const tbody = document.getElementById('catalogTableBody');
            tbody.innerHTML = '';
            if(products.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-3 text-slate-500">محصولی در کاتالوگ تعریف نشده است.</td></tr>';
                return;
            }
            products.forEach((p) => {
                tbody.innerHTML += `
                    <tr>
                        <td class="p-2"><b class="text-slate-200">${p.name}</b><br><span class="text-[10px] text-amber-400">${p.desc||''}</span></td>
                        <td class="p-2 text-slate-400">${p.unit}</td>
                        <td class="p-2 font-mono">${p.price.toLocaleString()}</td>
                        <td class="p-2"><input type="number" min="0" value="0" id="qty_${p.id}" onchange="calculateTotal()" class="w-12 bg-slate-950 border border-slate-700 text-center rounded"></td>
                        <td class="p-2 font-mono text-emerald-400" id="rowTotal_${p.id}">۰</td>
                    </tr>
                `;
            });
        }

        function calculateTotal() {
            let grandTotal = 0;
            products.forEach(p => {
                const qty = parseInt(document.getElementById(`qty_${p.id}`)?.value) || 0;
                const rowTotal = qty * p.price;
                if(document.getElementById(`rowTotal_${p.id}`)) document.getElementById(`rowTotal_${p.id}`).innerText = rowTotal.toLocaleString();
                grandTotal += rowTotal;
            });
            document.getElementById('grandTotal').innerText = grandTotal.toLocaleString() + ' ریال';
        }

        function submitOrder() {
            let orderItems = [];
            let total = 0;
            products.forEach(p => {
                const qty = parseInt(document.getElementById(`qty_${p.id}`)?.value) || 0;
                if(qty > 0) {
                    orderItems.push(`${p.name} (${qty} ${p.unit})`);
                    total += qty * p.price;
                }
            });

            if(orderItems.length === 0) return alert('لطفاً حداقل یک محصول را انتخاب کنید.');

            const orderData = {
                id: Date.now(),
                userCode: currentUser.code,
                userName: currentUser.name,
                userPhone: currentUser.phone,
                items: orderItems,
                total: total,
                status: 'در حال بررسی ⏳',
                shipping: 'در حال آماده‌سازی انبار 📦',
                date: new Date().toLocaleDateString('fa-IR')
            };

            let allOrders = JSON.parse(localStorage.getItem('kt_orders')) || [];
            allOrders.push(orderData);
            localStorage.setItem('kt_orders', JSON.stringify(allOrders));

            const smsText = encodeURIComponent(`سفارش جدید کاریز طب\nمشتری: ${currentUser.name}\nکد: ${currentUser.code}\nمبلغ: ${total.toLocaleString()} ریال`);
            window.open(`sms:09398490440?body=${smsText}`, '_blank');
            loadUserOrderHistory();
        }

        function loadUserOrderHistory() {
            let allOrders = JSON.parse(localStorage.getItem('kt_orders')) || [];
            const userOrders = allOrders.filter(o => o.userPhone === currentUser.phone);
            const container = document.getElementById('ordersList');

            if(userOrders.length === 0) {
                container.innerHTML = `<p class="text-slate-500 text-center py-2">هیچ سفارشی ثبت نشده است.</p>`;
                return;
            }

            container.innerHTML = '';
            userOrders.reverse().forEach(o => {
                container.innerHTML += `
                    <div class="bg-slate-950 border border-slate-800 p-3 rounded-xl space-y-1">
                        <div class="flex justify-between font-bold"><span>تاریخ: ${o.date}</span><span class="text-amber-400">${o.status}</span></div>
                        <div class="text-slate-300">${o.items.join(' ، ')}</div>
                        <div class="flex justify-between text-[11px] pt-1"><span>ارسال: <b class="text-blue-400">${o.shipping}</b></span><span class="text-emerald-400 font-bold">${o.total.toLocaleString()} ریال</span></div>
                        ${o.note ? `<div class="bg-rose-500/10 text-rose-300 p-1.5 rounded text-[10px]">⚠️ مدیر: ${o.note}</div>` : ''}
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
