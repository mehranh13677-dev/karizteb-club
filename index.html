
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>باشگاه مشتریان کاریز طب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style> body { font-family: 'Vazirmatn', sans-serif; } </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 p-6 relative">
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-blue-600 rounded-2xl mx-auto flex items-center justify-center text-2xl font-bold text-white shadow-lg mb-3">K</div>
            <h1 class="text-2xl font-black text-white">باشگاه مشتریان کاریز طب</h1>
            <p class="text-xs text-slate-400 mt-1">سامانه دریافت کد اختصاصی و پیگیری امتیازات</p>
        </div>

        <!-- دکمه‌های سوئیچ -->
        <div id="authTabs" class="grid grid-cols-2 bg-slate-900 p-1 rounded-xl mb-6">
            <button type="button" id="btnLoginTab" class="py-2 text-sm font-bold rounded-lg bg-blue-600 text-white transition-all">ورود به حساب</button>
            <button type="button" id="btnRegisterTab" class="py-2 text-sm font-bold rounded-lg text-slate-400 hover:text-white transition-all">ثبت‌نام جدید</button>
        </div>

        <!-- فرم ورود -->
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">نام کاربری</label>
                <input type="text" id="loginUsername" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 text-white" placeholder="نام کاربری خود را وارد کنید">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">رمز عبور</label>
                <input type="password" id="loginPassword" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 text-white" placeholder="******">
            </div>
            <button type="submit" id="loginSubmitBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl text-sm shadow-lg transition-all">ورود به داشبورد</button>
            <div class="text-center mt-3">
                <button type="button" onclick="showForgotPassword()" class="text-xs text-blue-400 hover:underline">نام کاربری یا رمز عبور را فراموش کرده‌اید؟</button>
            </div>
        </form>

        <!-- فرم ثبت‌نام -->
        <form id="registerForm" class="space-y-3 hidden">
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">نام و نام خانوادگی / نام مرکز</label>
                <input type="text" id="regFullName" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white" placeholder="مثال: دکتر حسینی">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">شماره همراه</label>
                <input type="tel" id="regPhone" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white" placeholder="09123456789">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">شهر / استان</label>
                <input type="text" id="regCity" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white" placeholder="مثال: کرج">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">تعیین نام کاربری (انگلیسی)</label>
                <input type="text" id="regUsername" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white" placeholder="مثال: Mehran67">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">تعیین رمز عبور</label>
                <input type="password" id="regPassword" required minlength="4" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white" placeholder="حداقل ۴ کاراکتر">
            </div>
            <button type="submit" id="regSubmitBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl text-sm shadow-lg transition-all mt-2">ثبت‌نام و دریافت کد اختصاصی</button>
        </form>

        <!-- داشبورد اختصاصی -->
        <div id="userDashboard" class="hidden space-y-5">
            <div class="bg-slate-900/80 border border-slate-700 p-4 rounded-xl flex items-center justify-between">
                <div>
                    <h2 id="dashCustomerName" class="font-bold text-white text-base">---</h2>
                    <p id="dashCustomerPhone" class="text-xs text-slate-400 mt-0.5">---</p>
                </div>
                <button type="button" onclick="logout()" class="bg-rose-500/10 text-rose-400 text-xs px-3 py-1.5 rounded-lg border border-rose-500/20 hover:bg-rose-500 hover:text-white transition-all">خروج</button>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-blue-600/10 border border-blue-500/30 p-4 rounded-xl text-center">
                    <span class="text-xs text-blue-300 block mb-1">کد اختصاصی</span>
                    <span id="dashClubCode" class="text-lg font-black text-blue-400 tracking-wider">----</span>
                </div>
                <div class="bg-amber-600/10 border border-amber-500/30 p-4 rounded-xl text-center">
                    <span class="text-xs text-amber-300 block mb-1">امتیاز فعال</span>
                    <span id="dashPoints" class="text-lg font-black text-amber-400">0</span>
                </div>
            </div>
            <div>
                <h3 class="text-xs font-bold text-slate-300 mb-2">📋 ریز خریدها و تسویه‌ها</h3>
                <div id="dashTransactions" class="bg-slate-900 border border-slate-700 rounded-xl p-3 max-h-48 overflow-y-auto divide-y divide-slate-800 text-xs">
                    <p class="text-slate-500 text-center py-4">هنوز تراکنشی ثبت نشده است.</p>
                </div>
            </div>
        </div>

        <div id="msgBox" class="mt-4 p-3 rounded-xl text-xs text-center hidden"></div>
    </div>

    <script>
        const btnLoginTab = document.getElementById('btnLoginTab');
        const btnRegisterTab = document.getElementById('btnRegisterTab');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');

        btnLoginTab.addEventListener('click', function() {
            loginForm.classList.remove('hidden');
            registerForm.classList.add('hidden');
            btnLoginTab.className = 'py-2 text-sm font-bold rounded-lg bg-blue-600 text-white transition-all';
            btnRegisterTab.className = 'py-2 text-sm font-bold rounded-lg text-slate-400 hover:text-white transition-all';
            hideMsg();
        });

        btnRegisterTab.addEventListener('click', function() {
            registerForm.classList.remove('hidden');
            loginForm.classList.add('hidden');
            btnRegisterTab.className = 'py-2 text-sm font-bold rounded-lg bg-emerald-600 text-white transition-all';
            btnLoginTab.className = 'py-2 text-sm font-bold rounded-lg text-slate-400 hover:text-white transition-all';
            hideMsg();
        });

        function getDB() {
            return JSON.parse(localStorage.getItem('karizteb_db') || '[]');
        }

        function saveDB(data) {
            localStorage.setItem('karizteb_db', JSON.stringify(data));
        }

        window.onload = function() {
            const savedSession = localStorage.getItem('karizteb_current_user');
            if (savedSession) {
                showDashboard(JSON.parse(savedSession));
            }
        };

        registerForm.addEventListener('submit', function(e) {
            e.preventDefault();
            hideMsg();

            const fullName = document.getElementById('regFullName').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const city = document.getElementById('regCity').value.trim();
            const username = document.getElementById('regUsername').value.trim().toLowerCase();
            const password = document.getElementById('regPassword').value;

            const db = getDB();
            const exists = db.find(u => u.username === username);
            if (exists) {
                showMsg('این نام کاربری قبلاً ثبت شده است.', 'error');
                return;
            }

            const clubCode = 'KT-' + Math.floor(1000 + Math.random() * 9000);
            const newUser = {
                fullName,
                phone,
                city,
                username,
                password,
                clubCode,
                points: 0,
                transactions: []
            };

            db.push(newUser);
            saveDB(db);

            localStorage.setItem('karizteb_current_user', JSON.stringify(newUser));
            showDashboard(newUser);
        });

        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            hideMsg();

            const username = document.getElementById('loginUsername').value.trim().toLowerCase();
            const password = document.getElementById('loginPassword').value;

            const db = getDB();
            const user = db.find(u => u.username === username && u.password === password);

            if (!user) {
                showMsg('نام کاربری یا رمز عبور اشتباه است.', 'error');
            } else {
                localStorage.setItem('karizteb_current_user', JSON.stringify(user));
                showDashboard(user);
            }
        });

        function showDashboard(user) {
            document.getElementById('authTabs').classList.add('hidden');
            loginForm.classList.add('hidden');
            registerForm.classList.add('hidden');
            document.getElementById('userDashboard').classList.remove('hidden');

            document.getElementById('dashCustomerName').innerText = user.fullName || 'مشتری کاریز طب';
            document.getElementById('dashCustomerPhone').innerText = (user.phone || '') + ' (' + (user.city || '') + ')';
            document.getElementById('dashClubCode').innerText = user.clubCode || '---';
            document.getElementById('dashPoints').innerText = user.points || 0;

            const txContainer = document.getElementById('dashTransactions');
            if (user.transactions && user.transactions.length > 0) {
                txContainer.innerHTML = user.transactions.map(t => `
                    <div class="py-2 flex justify-between items-center">
                        <div>
                            <p class="font-bold text-white">${t.title || 'خرید محصولات'}</p>
                            <p class="text-[10px] text-slate-400">${t.date || ''}</p>
                        </div>
                        <span class="font-bold ${t.type === 'plus' ? 'text-emerald-400' : 'text-slate-300'}">
                            ${t.amount || ''}
                        </span>
                    </div>
                `).join('');
            } else {
                txContainer.innerHTML = '<p class="text-slate-500 text-center py-4">هنوز خرید یا تسویه‌ای ثبت نشده است.</p>';
            }
        }

        function showForgotPassword() {
            const phone = prompt("لطفاً شماره همراه خود را وارد کنید:");
            if (phone) {
                window.location.href = `sms:09398490440?body=${encodeURIComponent('درخواست بازیابی رمز عبور کاریزطب: ' + phone)}`;
            }
        }

        function logout() {
            localStorage.removeItem('karizteb_current_user');
            location.reload();
        }

        function showMsg(msg, type) {
            const box = document.getElementById('msgBox');
            box.innerText = msg;
            box.classList.remove('hidden', 'bg-rose-500/20', 'text-rose-300', 'bg-emerald-500/20', 'text-emerald-300');
            if (type === 'error') {
                box.classList.add('bg-rose-500/20', 'text-rose-300');
            } else {
                box.classList.add('bg-emerald-500/20', 'text-emerald-300');
            }
        }

        function hideMsg() {
            document.getElementById('msgBox').classList.add('hidden');
        }
    </script>
</body>
</html>
